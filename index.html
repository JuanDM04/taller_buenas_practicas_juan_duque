<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Mujer</title>
    <style>
        body {
            text-align: center;
            background-color: #fce4ec;
            font-family: Arial, sans-serif;
            color: #880e4f;
            animation: fadeIn 2s ease-in;
        }
        h1 {
            font-size: 3em;
            margin-top: 20px;
            animation: bounce 2s infinite;
        }
        img {
            width: 60%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: fadeIn 3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <h1>¡Feliz Día de la Mujer, mi amor! 💖</h1>
    <img src="https://source.unsplash.com/600x400/?flowers,love">
    <p>Eres increíble y especial. Gracias por estar en mi vida. 💕</p>
</body>
</html>
